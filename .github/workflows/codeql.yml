name: CodeQL

# GitHub's code scanning for security problems in the Kotlin code: on pushes to main, on pull requests,
# and once a week (new checks are added over time, so an unchanged repository is still looked at again).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # to upload the results to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL watches this build to see the code. Tests and lint are CI's job, so they are skipped here.
      - name: Build for CodeQL
        run: ./gradlew assembleDebug --no-daemon -x lint -x test

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
