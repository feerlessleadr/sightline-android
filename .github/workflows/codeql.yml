name: CodeQL

# GitHub's code scanning for security problems in the Kotlin code: on pushes to main, on pull requests,
# and once a week (new checks are added over time, so an unchanged repository is still looked at again).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # to upload the results to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Its default list includes "tools", which no longer exists and fails the step.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL watches this build to see the code. Tests and lint are CI's job, so they are skipped here.
      - name: Build for CodeQL
        run: ./gradlew assembleDebug --no-daemon -x lint -x test

      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: "/language:java-kotlin"
