name: CI

# Builds the app, runs the unit tests and Android lint on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than read access to the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Refuse a tampered Gradle wrapper before running it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Accepts the Android SDK licences so Gradle can fetch the SDK platform the build needs.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - name: Unit tests, debug build and lint
        run: ./gradlew test assembleDebug lintDebug --stacktrace

      # Reports are only kept when something fails, to see why.
      - name: Keep the reports if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
