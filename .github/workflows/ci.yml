name: CI

# Builds the app, runs the unit tests and Android lint on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than read access to the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Refuse a tampered Gradle wrapper before running it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      # Accepts the Android SDK licences so Gradle can fetch the SDK platform the build needs.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Its default list includes "tools", which no longer exists and fails the step.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      # assembleRelease runs R8 (the shrinker), so a problem it causes shows up here and not on the first release.
      - name: Unit tests, debug and release builds, and lint
        run: ./gradlew test assembleDebug assembleRelease lintDebug --stacktrace

      # Reports are only kept when something fails, to see why.
      - name: Keep the reports if the build failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
