name: Release

# Builds, signs, checks and publishes a release when a version tag (v1.2.3) is pushed. Tags are only pushed when the owner
# says "publish it". The signing key lives in GitHub secrets; see docs/release.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  # SHA-256 of the release signing certificate, lower case hex without colons. This is public information. The build fails
  # when the APK is signed with anything else, so a wrong key can never be published, and it fails while this is empty.
  # The owner reads it from the key once it exists and it is pinned here (docs/release.md).
  EXPECTED_CERT_SHA256: "f35be2138ec75521a0d9a76a1f6c3cb6b36a37be36263823ad3ade394fb00d8b"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # to create the GitHub release and attach the files
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Stop early if the signing secrets or the pinned certificate are missing
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The GitHub secret $name is not set. See docs/release.md."
              exit 1
            fi
          done
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::EXPECTED_CERT_SHA256 is not pinned in release.yml. See docs/release.md."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main and has release notes
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi
          if [ ! -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::docs/releases/${GITHUB_REF_NAME}.md is missing. Write the release notes first."
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # Its default list includes "tools", which no longer exists and fails the step.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper runnable
        run: chmod +x ./gradlew

      - name: Put the signing key in a temporary file
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests, then the signed release build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew test assembleRelease -PappVersion="$VERSION" --stacktrace

      - name: Delete the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signature, the certificate, the package and the version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          CODE=$((MAJ * 1000000 + MIN * 1000 + PAT))
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${BT}apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt" \
            || grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apksigner.txt" \
            || { echo "::error::The APK is not signed with signature scheme v2 or v3."; exit 1; }
          # Newer apksigner versions label the line "Signer #1 certificate ..." or "V2 Signer: certificate ...".
          ACTUAL="$(grep -m1 -E "(Signer #1|V[0-9.]+ Signer:?) certificate SHA-256 digest:" "$RUNNER_TEMP/apksigner.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')" || true
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signer certificate digest from the apksigner output."
            exit 1
          fi
          if [ "$ACTUAL" != "$(echo "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')" ]; then
            echo "::error::The APK is signed with certificate $ACTUAL, not the pinned release certificate."
            exit 1
          fi
          BADGING="$("${BT}aapt2" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.feerlessleadr.sightline'" || { echo "::error::Unexpected package name."; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION'" || { echo "::error::versionName does not match the tag."; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$CODE'" || { echo "::error::versionCode does not match the tag."; exit 1; }
          echo "ACTUAL_CERT=$ACTUAL" >> "$GITHUB_ENV"

      - name: Name the APK and make its checksum
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          mkdir -p dist
          cp "$APK" "dist/sightline-android-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "sightline-android-${GITHUB_REF_NAME}.apk" > "sightline-android-${GITHUB_REF_NAME}.apk.sha256")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "docs/releases/${GITHUB_REF_NAME}.md"
            echo
            echo "## Verify the download"
            echo
            echo "- APK SHA-256: \`$(cut -d' ' -f1 "dist/sightline-android-${GITHUB_REF_NAME}.apk.sha256")\`"
            echo "- Signing certificate SHA-256: \`${ACTUAL_CERT}\` (the same key signs every release)"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Sightline for Android ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
